services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keetype-backend
    restart: always
    environment:
      - APP_NAME=KeeType
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://keetype.my.id
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=keefastudys@gmail.com
      - MAIL_PASSWORD=ocxlpqxukhglldpc
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=keefastudys@gmail.com
      - MAIL_FROM_NAME=KeeType
    volumes:
      # Persistent SQLite volume - Database data is preserved across container rebuilds
      - ./backend/database:/var/www/html/database
      - ./backend/storage:/var/www/html/storage
    networks:
      - keetype-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keetype-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - keetype-network
      - web_proxy

networks:
  keetype-network:
    driver: bridge
  web_proxy:
    external: true
