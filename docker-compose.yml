version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keetype-backend
    restart: always
    environment:
      - APP_NAME=KeeType
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://keetype.my.id
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    volumes:
      # Persistent SQLite volume - Database data is preserved across container rebuilds
      - ./backend/database:/var/www/html/database
      - ./backend/storage:/var/www/html/storage
    networks:
      - keetype-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keetype-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - keetype-network

networks:
  keetype-network:
    driver: bridge
